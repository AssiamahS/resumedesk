<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
</head>
<body>
<title>Resume Desk</title>
<meta name="description" content="Edit resumes and documents like Google Docs, save to files, download as PDF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #e4e7ec;
  --chrome: #f7f8fa;
  --chrome-2: #eef0f4;
  --ink: #1a1e24;
  --muted: #5b6472;
  --line: #d3d7de;
  --accent: #1f5fae;
  --accent-soft: #dce7f6;
  --warn: #a4480f;
  --warn-soft: #fbe9dc;
  --ok: #2b7249;
  --ok-soft: #dff0e5;
  --paper: #ffffff;
  --paper-ink: #111111;
  --shadow: 0 1px 2px rgba(20, 30, 50, .10), 0 6px 24px rgba(20, 30, 50, .10);
  --ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --doc: Carlito, Calibri, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #14171c; --chrome: #1c2026; --chrome-2: #242931; --ink: #e6e9ee;
    --muted: #9aa3b0; --line: #2f353e; --accent: #7aa9ea; --accent-soft: #22324a;
    --warn: #f0a068; --warn-soft: #3a2618; --ok: #7ccf9a; --ok-soft: #1c3326;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] {
  --ground: #14171c; --chrome: #1c2026; --chrome-2: #242931; --ink: #e6e9ee;
  --muted: #9aa3b0; --line: #2f353e; --accent: #7aa9ea; --accent-soft: #22324a;
  --warn: #f0a068; --warn-soft: #3a2618; --ok: #7ccf9a; --ok-soft: #1c3326;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 14px/1.4 var(--ui);
  display: flex; flex-direction: column; overflow: hidden;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---------- top bar ---------- */
.top {
  background: var(--chrome); border-bottom: 1px solid var(--line);
  padding: 8px 16px 0; display: flex; flex-direction: column; gap: 6px;
  flex: none;
}
.titlerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mark {
  width: 30px; height: 36px; flex: none; border-radius: 3px;
  background: var(--paper); border: 1px solid var(--line);
  position: relative; box-shadow: 0 1px 1px rgba(0,0,0,.06);
}
.mark::before, .mark::after {
  content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: var(--accent);
}
.mark::before { top: 9px; }
.mark::after { top: 15px; box-shadow: 0 6px 0 var(--line), 0 12px 0 var(--line); background: var(--line); }
.titleblock { display: flex; flex-direction: column; min-width: 0; flex: 1 1 220px; }
#docName {
  border: 1px solid transparent; background: transparent; border-radius: 4px;
  font-size: 17px; font-weight: 500; padding: 1px 6px; margin-left: -6px; width: 100%; max-width: 520px;
}
#docName:hover { border-color: var(--line); }
#docName:focus { border-color: var(--accent); background: var(--paper); color: var(--paper-ink); outline: none; }
.menus { display: flex; gap: 2px; flex-wrap: wrap; margin-left: -8px; }
.menu { position: relative; }
.menu > button {
  background: none; border: 0; padding: 2px 8px; border-radius: 4px; font-size: 13.5px;
}
.menu > button:hover, .menu.open > button { background: var(--chrome-2); }
.dropdown {
  position: absolute; top: calc(100% + 2px); left: 0; z-index: 30; min-width: 250px;
  background: var(--chrome); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: var(--shadow); padding: 5px 0; display: none;
}
.menu.open .dropdown { display: block; }
.dropdown button {
  display: flex; justify-content: space-between; gap: 18px; width: 100%;
  background: none; border: 0; text-align: left; padding: 6px 14px; font-size: 13.5px;
}
.dropdown button:hover { background: var(--accent-soft); }
.dropdown kbd, .dropdown .hint { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.dropdown hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }
.dropdown .label {
  padding: 4px 14px 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}
.actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
.btn {
  border: 1px solid var(--line); background: var(--chrome); border-radius: 18px;
  padding: 6px 14px; font-size: 13.5px; font-weight: 500; white-space: nowrap;
}
.btn:hover { background: var(--chrome-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0e1622; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0e1622; } }
.btn.primary:hover { filter: brightness(1.08); }

/* ---------- toolbar ---------- */
.toolbar {
  display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
  background: var(--chrome-2); border-radius: 20px; padding: 3px 8px; margin-bottom: 8px;
}
.tb {
  background: none; border: 0; border-radius: 4px; min-width: 28px; height: 28px; padding: 0 6px;
  display: inline-flex; align-items: center; justify-content: center; font-size: 13.5px;
}
.tb:hover { background: var(--line); }
.tb.on { background: var(--accent-soft); color: var(--accent); }
.tb svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 5px; }
.toolbar select {
  height: 28px; border: 0; background: none; border-radius: 4px; padding: 0 4px; font-size: 13.5px;
}
.toolbar select:hover { background: var(--line); }
.size { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 4px; height: 26px; }
.size button { background: none; border: 0; width: 22px; height: 24px; }
.size input { width: 38px; text-align: center; border: 0; background: none; font-family: var(--mono); font-size: 12.5px; height: 24px; }

/* ---------- workspace ---------- */
.work { flex: 1; display: flex; min-height: 0; }
.rail {
  width: 232px; flex: none; border-right: 1px solid var(--line); background: var(--chrome);
  overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 4px;
}
.rail h2 {
  font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: var(--muted); margin: 6px 8px 4px;
}
.doc-item {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px;
  border: 0; background: none; text-align: left; border-radius: 6px; padding: 7px 8px; width: 100%;
}
.doc-item:hover { background: var(--chrome-2); }
.doc-item.active { background: var(--accent-soft); }
.doc-item .n { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-item .m { font-family: var(--mono); font-size: 11px; color: var(--muted); grid-column: 1 / -1; }
.doc-item .x {
  opacity: 0; border: 0; background: none; color: var(--muted); border-radius: 4px; width: 22px; height: 22px; font-size: 15px;
}
.doc-item:hover .x, .doc-item.active .x { opacity: 1; }
.doc-item .x:hover { background: var(--line); color: var(--ink); }
.rail .new { margin: 8px 4px 0; }

.canvas { flex: 1; overflow: auto; padding-block: 28px 80px; padding-inline: 16px; min-width: 0; }
.pagewrap { width: fit-content; margin: 0 auto; }
.page {
  /* US Letter with the build.sh margins: 0.4 top, 0.35 bottom, 0.5 sides */
  /* each 11in sheet is painted separately with a 14px gap, like Docs' page view;
     paginate() pushes any block that would cross a sheet edge onto the next sheet */
  width: 8.5in; min-height: 11in; color: var(--paper-ink);
  padding: .4in .5in .35in; position: relative;
  font-family: var(--doc); font-size: 9.2pt; line-height: 1.1;
  font-variant-ligatures: none;
  background: repeating-linear-gradient(to bottom,
    var(--paper) 0, var(--paper) 11in, transparent 11in, transparent calc(11in + 14px));
  filter: drop-shadow(0 1px 2px rgba(20, 30, 50, .14)) drop-shadow(0 4px 12px rgba(20, 30, 50, .10));
}
.page:focus { outline: none; }
.page h1 { font-size: 14pt; margin: 0 0 1pt; font-weight: 700; }
.page h2 { font-size: 10.2pt; margin: 5pt 0 1pt; font-weight: 700; }
.page h3 { font-size: 9.2pt; margin: 3pt 0 1pt; font-weight: 700; }
.page p { margin: 0; font-size: 8.9pt; }
.page ul, .page ol { margin: 1pt 0 3pt; padding-left: 14pt; }
.page li { margin: 0; }
.page a { color: inherit; }
.page-break-label {
  position: absolute; right: -2px; transform: translateX(100%); padding-left: 8px;
  font: 500 11px var(--mono); color: var(--warn); white-space: nowrap; pointer-events: none;
}

/* ---------- status bar ---------- */
.status {
  flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 5px 16px calc(5px + env(safe-area-inset-bottom, 0px));
  background: var(--chrome); border-top: 1px solid var(--line);
  font: 12px var(--mono); color: var(--muted);
}
.pill { padding: 1px 9px; border-radius: 10px; font-weight: 500; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.status .grow { flex: 1; }
.zoom { display: inline-flex; gap: 4px; align-items: center; }
.zoom button { border: 1px solid var(--line); background: none; border-radius: 4px; width: 22px; height: 20px; line-height: 1; }

.toast {
  position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--ground); padding: 9px 16px; border-radius: 6px;
  font-size: 13.5px; opacity: 0; transition: opacity .18s, transform .18s; pointer-events: none; z-index: 50;
  max-width: calc(100vw - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

#docPicker { display: none; }
@media (max-width: 900px) {
  .rail { display: none; }
  #docPicker {
    display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 6px;
    background: var(--chrome); padding: 4px 6px; font-size: 13px;
  }
  .page-break-label { display: none; }
}
@media (max-width: 560px) {
  .mark { display: none; }
  .top { gap: 4px; }
  .titleblock { flex-basis: 100%; }
  #docName { font-size: 15px; }
  #docPicker { flex: 1; min-width: 0; }
  .actions { margin-left: 0; }
  .actions .btn:not(.primary):not([data-act="open"]) { display: none; }
  .toolbar .wide { display: none; }
  .canvas { padding-block: 14px 40px; }
}
/* inside the iPhone app the web view already sits below the status bar */
.native .top { padding-top: 6px; }

@media print {
  @page { size: letter; margin: 0; }
  body { display: block; overflow: visible; background: #fff; height: auto; }
  .top, .rail, .status, .toast, .page-break-label { display: none !important; }
  .work, .canvas { display: block; overflow: visible; padding: 0; }
  .pagewrap { zoom: 1 !important; }
  .page { filter: none; background: #fff; width: auto; min-height: 0 !important; }
}
</style>

<header class="top">

<script type="application/json" id="seeds">[]</script>
<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const page = $('#page');
const LS_KEY = 'resumeDesk.v1';
const SEEDS = JSON.parse($('#seeds').textContent);
const PX_PER_IN = 96;
const SHEET = 11 * PX_PER_IN, GAP = 14, PERIOD = SHEET + GAP;
const M_TOP = 0.4 * PX_PER_IN, M_BOT = 0.35 * PX_PER_IN;   // build.sh margins
const NATIVE = window.webkit?.messageHandlers?.desk;        // running inside Resume Desk.app

document.execCommand('defaultParagraphSeparator', false, 'p');

/* ---------- markdown <-> html (same rules as render.py) ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const inline = t => esc(t)
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, '$1<i>$2</i>');

function mdToHtml(md) {
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of md.split(/\r?\n/)) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) continue;
    let m;
    if (line.startsWith('# ')) { close(); out.push(`<h1>${inline(line.slice(2))}</h1>`); }
    else if (line.startsWith('## ')) { close(); out.push(`<h2>${inline(line.slice(3))}</h2>`); }
    else if (line.startsWith('### ')) { close(); out.push(`<h3>${inline(line.slice(4))}</h3>`); }
    else if (/^[-*•] /.test(line)) {
      if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; }
      out.push(`<li>${inline(line.slice(2))}</li>`);
    } else if ((m = line.match(/^\d+[.)] (.*)$/))) {
      if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; }
      out.push(`<li>${inline(m[1])}</li>`);
    } else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();
  return out.join('\n');
}

function runsToMd(node) {
  let s = '';
  for (const n of node.childNodes) {
    if (n.nodeType === 3) { s += n.nodeValue.replace(/ /g, ' '); continue; }
    if (n.nodeType !== 1) continue;
    if (n.tagName === 'BR') { s += '\n'; continue; }
    const cs = getComputedStyle(n), parent = getComputedStyle(n.parentElement);
    let inner = runsToMd(n);
    const bold = +cs.fontWeight >= 600 && +parent.fontWeight < 600;
    const ital = cs.fontStyle === 'italic' && parent.fontStyle !== 'italic';
    const wrap = (t, mk) => {

      y += lh;
    });
    prevMb = b.mb * scale;
  }
  doc.setProperties({ title: safeName(), creator: 'Resume Desk' });
  return { doc, pages };
}

async function buildPdf() {
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  const { jsPDF } = window.jspdf;
  const want = pageCount();
  clearBreaks();
  const blocks = collectBlocks();
  paginate();
  let scale = 1, out = layoutPdf(jsPDF, blocks, scale);
  // the editor shows N pages; if Helvetica's wider glyphs spill onto N+1, shrink gently
  while (out.pages > want && scale > 0.8) { scale = +(scale - 0.02).toFixed(2); out = layoutPdf(jsPDF, blocks, scale); }
  return { blob: out.doc.output('blob'), scale, pages: out.pages };
}

/* ---------- opening files ---------- */
async function toB64(blob) {
  const bytes = new Uint8Array(await blob.arrayBuffer()); let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
const fromB64 = (b64, name) => new File([Uint8Array.from(atob(b64), c => c.charCodeAt(0))], name);
// the app hands over files opened from Files / "Open in Resume Desk"
window.deskImport = (name, b64, path) => importFile(fromB64(b64, name), null, path);
async function importFile(file, handle, nativePath) {
  const ext = file.name.split('.').pop().toLowerCase();
  const name = file.name.replace(/\.[^.]+$/, '');
  let html;
  try {
    if (ext === 'md' || ext === 'markdown') html = mdToHtml(await file.text());
    else if (ext === 'txt') html = (await file.text()).split(/\r?\n/).filter(l => l.trim()).map(l => `<p>${esc(l)}</p>`).join('\n');
    else if (ext === 'html' || ext === 'htm') html = sanitize(await file.text());
    else if (ext === 'pdf') { toast('Reading PDF…', 8000); html = await pdfToHtml(await file.arrayBuffer()); }
    else if (ext === 'docx') {
      toast('Reading Word file…', 8000);
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      html = sanitize((await window.mammoth.convertToHtml({ arrayBuffer: await file.arrayBuffer() })).value);
    } else { toast('That file type is not supported. Use .md, .txt, .html, .pdf or .docx.'); return; }
  } catch (e) { toast(`Could not open ${file.name}: ${e.message || e}`, 5000); return; }
  const d = newDoc(name, html || '<p><br></p>');
  if (handle && ext === 'md') handles[d.id] = handle;   // Save writes straight back to this .md
  if (nativePath && ext === 'md') { d.path = nativePath; persist(); }
  toast(`Opened ${file.name}`);
}

function sanitize(src) {
  const tpl = new DOMParser().parseFromString(src, 'text/html');
  tpl.querySelectorAll('script,style,link,meta,iframe,object,embed,title').forEach(n => n.remove());
  tpl.querySelectorAll('*').forEach(n => {
    for (const a of [...n.attributes]) if (/^on/i.test(a.name) || (a.name === 'href' && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name);
    // drop the render.py inline margins/fonts so the editor's styles apply; keep alignment
    if (n.style) { const al = n.style.textAlign; n.removeAttribute('style'); if (al) n.style.textAlign = al; }
  });
  return tpl.body.innerHTML;
}

async function pdfToHtml(buf) {
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(base + 'pdf.min.js');
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = (NATIVE ? 'lib/' : base) + 'pdf.worker.min.js';
  let pdf;
  try { pdf = await lib.getDocument({ data: buf.slice(0) }).promise; }
  catch (e) { pdf = await lib.getDocument({ data: buf.slice(0), disableWorker: true }).promise; }
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const pg = await pdf.getPage(p);
    try { await pg.getOperatorList(); } catch (e) {}
    const tc = await pg.getTextContent();
    const rows = new Map();
    for (const it of tc.items) {
      if (!it.str) continue;
      const y = Math.round(it.transform[5]);
      const key = [...rows.keys()].find(k => Math.abs(k - y) <= 2) ?? y;
      if (!rows.has(key)) rows.set(key, []);
      let bold = false;
      try { const f = pg.commonObjs.get(it.fontName); bold = /bold|black|heavy|semibold/i.test(f?.name || ''); } catch (e) {}
      rows.get(key).push({ x: it.transform[4], str: it.str, size: Math.hypot(it.transform[2], it.transform[3]), bold });
    }
    [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, items]) => {
      items.sort((a, b) => a.x - b.x);
      lines.push({ items, size: Math.max(...items.map(i => i.size)) });
    });
  }
  const sizes = lines.map(l => l.size).sort((a, b) => a - b);
  const median = sizes[Math.floor(sizes.length / 2)] || 10;
  const maxSize = sizes[sizes.length - 1] || median;
  const out = []; let inList = false;
  for (const l of lines) {
    let htmlLine = '', lastBold = null;
    for (const it of l.items) {
      if (it.bold !== lastBold) { if (lastBold) htmlLine += '</b>'; if (it.bold) htmlLine += '<b>'; lastBold = it.bold; }
      htmlLine += esc(it.str);
    }
    if (lastBold) htmlLine += '</b>';
    htmlLine = htmlLine.replace(/<\/b><b>/g, '').trim();
    const plain = l.items.map(i => i.str).join('').trim();
    if (!plain) continue;
    const allBold = l.items.every(i => i.bold || !i.str.trim());
    const bullet = /^[•●▪◦‣\-–]\s*/.test(plain);
    if (!bullet && inList) { out.push('</ul>'); inList = false; }
    if (bullet) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${htmlLine.replace(/^(<b>)?[•●▪◦‣\-–]\s*/, '$1')}</li>`);
    } else if (l.size >= maxSize * 0.98 && l.size > median * 1.3) out.push(`<h1>${plain && esc(plain)}</h1>`);
    else if (l.size > median * 1.08 || (allBold && plain === plain.toUpperCase() && /[A-Z]/.test(plain))) out.push(`<h2>${esc(plain)}</h2>`);
    else out.push(`<p>${htmlLine}</p>`);
  }
  if (inList) out.push('</ul>');
  return out.join('\n');
}

async function openPicker() {
  if (NATIVE) { const r = await native('open'); if (r) importFile(fromB64(r.b64, r.name), null, r.path); return; }
  if (window.showOpenFilePicker && !inFrame) {
    try {
      const [h] = await showOpenFilePicker({ types: [{ description: 'Documents',
        accept: { 'text/markdown': ['.md', '.markdown'], 'text/plain': ['.txt'], 'text/html': ['.html', '.htm'],
          'application/pdf': ['.pdf'], 'application/vnd.openxmlformats-officedocument.wordprocessingml.document': ['.docx'] } }] });
      return importFile(await h.getFile(), h);
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  $('#fileInput').click();
}
$('#fileInput').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
// drop a file anywhere to open it
document.addEventListener('dragover', e => { if (e.dataTransfer?.types.includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => { const f = e.dataTransfer?.files?.[0]; if (f) { e.preventDefault(); importFile(f); } });

/* ---------- find & replace ---------- */
function findReplace() {
  const find = prompt('Find:'); if (!find) return;
  const repl = prompt(`Replace "${find}" with (leave empty to just count):`);
  const walker = document.createTreeWalker(page, NodeFilter.SHOW_TEXT);
  let n, count = 0;
  while ((n = walker.nextNode())) {
    const parts = n.nodeValue.split(find);
    if (parts.length > 1) { count += parts.length - 1; if (repl !== null && repl !== '') n.nodeValue = parts.join(repl); }
  }
  if (repl) { markDirty(); toast(`Replaced ${count} match${count === 1 ? '' : 'es'}`); }
  else toast(`${count} match${count === 1 ? '' : 'es'} for "${find}"`);
}

/* ---------- actions ---------- */
const ACTIONS = {
  new: () => newDoc('Untitled document', '<h1>Untitled document</h1><p><br></p>'),
  open: openPicker,
  duplicate: () => { const d = cur(); saveLocal(true); newDoc(d.name + ' (copy)', cleanHtml()); toast('Copy created'); },
  save: () => doSave('save'), saveas: () => doSave('saveas'),
  pdf: () => doSave('pdf'), md: () => doSave('md'), html: () => doSave('html'), txt: () => doSave('txt'),
  print: () => { saveLocal(true); NATIVE ? native('print') : window.print(); },
  share: async () => {
    toast('Building PDF…', 8000);
    try { const { blob } = await buildPdf(); await native('share', { filename: safeName() + '.pdf', b64: await toB64(blob) }); }
    catch (e) { toast('PDF failed: ' + (e.message || e)); return; }
    $('#toast').classList.remove('show');
  },
  find: findReplace,
  revert: () => {
    const d = cur(), seed = SEEDS.find(s => s.id === d.id);
    if (!seed) { toast('Only the built-in resumes have an original to revert to'); return; }
    if (!confirm(`Throw away your edits to "${d.name}" and restore the original?`)) return;
    page.innerHTML = mdToHtml(seed.md); d.html = page.innerHTML; d.updated = null; d.name = seed.name;
    $('#docName').value = seed.name; dirty = false; persist(); renderLists(); refreshStatus(); toast('Restored the original');
  },
};
$$('[data-act]').forEach(b => b.addEventListener('click', () => { closeMenus(); ACTIONS[b.dataset.act](); }));

document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey; if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); doSave(e.shiftKey ? 'saveas' : 'save'); }
  else if (k === 'o') { e.preventDefault(); openPicker(); }
  else if (k === 'p') { e.preventDefault(); ACTIONS.print(); }
  else if (k === 'f' && !e.shiftKey) { e.preventDefault(); findReplace(); }
  else if (k === '\\') { e.preventDefault(); exec('removeFormat'); }
});

/* ---------- zoom (fits the page on a phone) ---------- */
let zoom = 1, userZoom = false;
function applyZoom() {
  $('#pagewrap').style.zoom = zoom; $('#zVal').textContent = Math.round(zoom * 100) + '%';
}
function fitZoom() {
  if (userZoom) return;
  const avail = $('#canvas').clientWidth - 32;
  zoom = Math.min(1, Math.max(0.35, avail / (8.5 * PX_PER_IN)));
  applyZoom();
}
$('#zIn').addEventListener('click', () => { userZoom = true; zoom = Math.min(2, +(zoom + 0.1).toFixed(2)); applyZoom(); });
$('#zOut').addEventListener('click', () => { userZoom = true; zoom = Math.max(0.3, +(zoom - 0.1).toFixed(2)); applyZoom(); });
addEventListener('resize', fitZoom);
addEventListener('beforeunload', () => saveLocal(true));
document.addEventListener('visibilitychange', () => { if (document.hidden) saveLocal(true); });

/* ---------- simulator self-test (RESUMEDESK_DEMO=1) ---------- */
window.deskDemo = async () => {
  const log = m => NATIVE ? native('log', { msg: m }) : console.log(m);
  try {
    if (document.fonts) await document.fonts.ready;
    refreshStatus();
    log(`doc="${cur().name}" pages=${pages} ${$('#words').textContent}`);
    const { blob, scale, pages: pdfPages } = await buildPdf();
    log(`pdf bytes=${blob.size} pages=${pdfPages} scale=${scale}`);
    const back = await pdfToHtml(await blob.arrayBuffer());
    log(`pdf re-import blocks=${(back.match(/<(h1|h2|p|li)>/g) || []).length} name_ok=${back.includes(cur().name.split(' ')[0])}`);
    log(`md lines=${htmlToMd(page).split('\n').length}`);
    log('DEMO OK');
  } catch (e) { log('DEMO FAILED ' + (e.message || e)); }
};

/* ---------- boot ---------- */
if (NATIVE) { $('#shareItem').hidden = false; document.documentElement.classList.add('native'); }
load(); renderLists(); openDoc(state.current); fitZoom();
if (document.fonts) document.fonts.ready.then(refreshStatus);
})();
